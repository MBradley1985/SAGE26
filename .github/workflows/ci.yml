name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# The Makefile's CI path (CI=true) assumes GSL and HDF5 live in one conda
# prefix (HDF5_DIR is derived from `gsl-config --prefix`), so dependencies
# are installed with micromamba rather than apt (Debian's split hdf5/serial
# layout is not compatible with -I$(HDF5_DIR)/include).

jobs:
  build-and-unit-tests:
    name: Serial build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install GSL + HDF5 (conda prefix)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: sage-ci
          create-args: gsl hdf5 make
          init-shell: bash

      - name: Build (serial, HDF5, -Werror via CI=true)
        run: make USE-MPI=

      - name: Run unit tests
        run: make -C tests test

  mpi-build:
    name: MPI build check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install GSL + HDF5 + OpenMPI (conda prefix)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: sage-ci
          create-args: gsl hdf5 openmpi make
          init-shell: bash

      - name: Build (MPI, HDF5)
        run: make

  smoke-run:
    name: Mini-Millennium smoke run
    runs-on: ubuntu-latest
    # Depends on an external download of the mini-Millennium trees; do not
    # block merges if the mirror is temporarily unavailable.
    continue-on-error: true
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install GSL + HDF5 (conda prefix)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: sage-ci
          create-args: gsl hdf5 make
          init-shell: bash

      - name: Cache mini-Millennium trees
        id: cache-trees
        uses: actions/cache@v4
        with:
          path: input/millennium
          key: mini-millennium-treefiles-v1

      - name: Download mini-Millennium trees
        if: steps.cache-trees.outputs.cache-hit != 'true'
        run: |
          wget -q "https://www.dropbox.com/s/l5ukpo7ar3rgxo4/mini-millennium-treefiles.tar?dl=1" -O mini-millennium-treefiles.tar
          tar -xf mini-millennium-treefiles.tar   # unpacks into input/millennium/trees/
          rm mini-millennium-treefiles.tar

      - name: Build (serial, HDF5)
        run: make USE-MPI=

      - name: Run sage on mini-Millennium
        run: |
          sed -e "s|^OutputDir .*|OutputDir ${GITHUB_WORKSPACE}/output/millennium/|" \
              -e "s|^SimulationDir .*|SimulationDir ${GITHUB_WORKSPACE}/input/millennium/trees/|" \
              -e "s|^FileWithSnapList .*|FileWithSnapList ${GITHUB_WORKSPACE}/input/millennium/trees/millennium.a_list|" \
              input/millennium.par > ci_millennium.par
          mkdir -p output/millennium
          ./sage ci_millennium.par
          ls -l output/millennium/
          test -s output/millennium/model_0.hdf5

      # Byte-for-byte regression is a local gate, not a CI gate: hashes are
      # only reproducible within a fixed toolchain (see
      # docs/developer/REGRESSION_BASELINE.md). This job only proves the code
      # builds and runs to completion on Linux/gcc.
